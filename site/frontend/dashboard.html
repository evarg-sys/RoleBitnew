<!DOCTYPE html>
<html>
<head>
  <title>Rolebit – Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="page-loader.js"></script>
  <style>
    html {
      min-height: 100%;
      background: #050807;
    }

    body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: transparent;
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(18, 55, 35, 0.48), transparent 36%),
        radial-gradient(circle at 74% 22%, rgba(35, 95, 70, 0.16), transparent 32%),
        radial-gradient(circle at 84% 82%, rgba(12, 42, 25, 0.42), transparent 38%),
        linear-gradient(180deg, #070a08, #040606);
      background-size: 160% 160%;
      animation: calmGradientDrift 90s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes calmGradientDrift {
      0% { background-position: 0% 0%, 80% 20%, 100% 100%, 50% 50%; }
      50% { background-position: 30% 10%, 60% 40%, 70% 80%, 50% 50%; }
      100% { background-position: 60% 20%, 40% 60%, 40% 60%, 50% 50%; }
    }

    .sidebar {
      left: 12px;
      top: 12px;
      height: calc(100vh - 24px);
      border-radius: 26px;
      border: 1px solid rgba(118, 216, 255, 0.24);
      background: linear-gradient(180deg, rgba(13, 22, 39, 0.95), rgba(10, 16, 30, 0.95));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .sidebar a {
      border-radius: 999px;
      margin: 6px 0;
      border: 1px solid transparent;
    }

    .sidebar a:hover {
      border-color: rgba(118, 216, 255, 0.3);
      background: rgba(17, 43, 68, 0.8);
    }

    /* Dashboard-specific styles */
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-left: 84px;
      padding: 40px 60px;
      min-height: 100vh;
      height: auto;
      overflow: visible;
      box-sizing: border-box;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dashboard-main,
    .top-right-logout-btn {
      position: relative;
      z-index: 1;
    }

    .sidebar:hover ~ .dashboard-container {
      margin-left: 234px;
    }


    .dashboard-main {
      display: flex;
      flex-direction: column;
      gap: 40px;
      min-height: auto;
      overflow: visible;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dashboard-header h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dashboard-header .logout-btn,
    .dashboard-header .edit-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }

    .dashboard-header .edit-btn {
      background: rgba(100, 200, 255, 0.15);
      border-color: rgba(100, 200, 255, 0.3);
    }

    .dashboard-header .edit-btn.active {
      background: rgba(100, 200, 255, 0.3);
      border-color: rgba(100, 200, 255, 0.5);
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
    }

    .dashboard-header .logout-btn:hover,
    .dashboard-header .edit-btn:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 12px rgba(255,255,255,0.2);
    }

    /* Projects Section */
    .projects-section h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: white;
    }

    .add-project-btn {
      background: rgba(47, 88, 130, 0.34);
      border: 1.3px solid rgba(111, 201, 255, 0.54);
      color: rgba(229, 243, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .add-project-btn:hover {
      background: rgba(71, 124, 178, 0.5);
      color: rgba(238, 248, 255, 0.98);
      border-color: rgba(141, 217, 255, 0.72);
      box-shadow: 0 8px 20px rgba(12, 25, 44, 0.4);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .widgets-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .widgets-toolbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .widget-select {
      background: rgba(34, 66, 102, 0.42);
      border: 1.2px solid rgba(116, 202, 255, 0.56);
      color: rgba(229, 243, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 8px 16px;
      min-width: 150px;
      font-size: 0.9rem;
    }

    .widgets-workspace {
      border: none;
      border-radius: 18px;
      padding: 0;
      background: transparent;
      max-height: none;
      overflow: hidden;
      box-shadow: none;
    }

    .widgets-grid {
      --grid-cols: 12;
      --grid-gap: 14px;
      --row-height: 28px;
      display: grid !important;
      grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
      grid-auto-rows: var(--row-height);
      grid-auto-flow: dense;
      gap: var(--grid-gap);
      align-items: stretch;
      align-content: start;
      min-height: 360px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .widget {
      grid-column: span var(--w, 4);
      grid-row: span var(--h, 10);
      background: rgba(40, 50, 80, 0.6);
      border: 1px solid rgba(100, 200, 255, 0.15);
      border-radius: 16px;
      padding: 18px;
      padding-bottom: 56px;
      backdrop-filter: blur(15px);
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      cursor: grab;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 0;
      user-select: none;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      flex: initial;
    }

    .widget:active {
      cursor: grabbing;
    }

    .widget.dragging {
      opacity: 0.4;
      z-index: 1000;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.5);
      border-style: dashed;
    }

    .widget.drag-over {
      border-color: rgba(120, 220, 255, 0.7) !important;
      box-shadow: 0 0 0 2px rgba(120, 220, 255, 0.3) inset;
    }

    .widget::before {
      display: none;
    }

    .widget:hover {
      background: rgba(60, 80, 120, 0.8);
      border-color: rgba(100, 200, 255, 0.3);
      box-shadow: 0 0 30px rgba(100, 200, 255, 0.3),
                  inset 0 1px 10px rgba(100, 200, 255, 0.1);
      transform: translateY(-4px);
    }

    .widget-resize-handle {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 14px;
      height: 14px;
      border-right: 2px solid rgba(120, 220, 255, 0.7);
      border-bottom: 2px solid rgba(120, 220, 255, 0.7);
      cursor: nwse-resize;
      opacity: 0.7;
      z-index: 2;
      touch-action: none;
    }

    .widget-resizing {
      transition: none;
      box-shadow: 0 0 0 2px rgba(100, 200, 255, 0.35);
    }

    .widget-resizing:hover {
      transform: none !important;
    }

    .widget-resizing input,
    .widget-resizing textarea,
    .widget-resizing button,
    .widget-resizing .calendar-day {
      pointer-events: none;
    }

    /* Editable widgets */
    .widget[data-editable="true"] {
      cursor: pointer;
    }

    .widget[data-editable="true"]:hover {
      border-color: rgba(100, 200, 255, 0.4);
    }

    .editing-text {
      position: relative;
    }

    .editing-text:hover {
      background: rgba(100, 200, 255, 0.1);
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }

    .editing-text.editing {
      background: rgba(100, 200, 255, 0.15);
      border-radius: 4px;
      padding: 2px 4px;
      outline: 1px solid rgba(100, 200, 255, 0.4);
      outline-offset: 1px;
    }

    .editing-text.editing:focus {
      outline: 2px solid rgba(100, 200, 255, 0.6);
      outline-offset: 1px;
    }

    /* Prevent editing text from blocking drag */
    .widget.dragging .editing-text {
      pointer-events: none;
    }

    /* Widget header */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .widget-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .widget-footer-actions {
      position: absolute;
      left: 12px;
      right: 32px;
      bottom: 10px;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }

    .widget-footer-actions .small-action-btn {
      pointer-events: auto;
      max-width: 100%;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .widget-title {
      font-size: 1rem;
      font-weight: 700;
      color: white;
    }

    .widget-icon {
      font-size: 1.5rem;
      opacity: 0.7;
    }

    .widget-remove-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 120, 120, 0.45);
      background: rgba(255, 90, 90, 0.15);
      color: rgba(255, 190, 190, 0.95);
      font-size: 0.78rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .widget-remove-btn:hover {
      background: rgba(255, 90, 90, 0.3);
      border-color: rgba(255, 120, 120, 0.7);
    }

    /* Timer Widget */
    .timer-display {
      font-size: clamp(2rem, 3.8vw, 3.5rem);
      font-weight: 700;
      text-align: center;
      color: rgba(100, 200, 255, 0.9);
      font-variant-numeric: tabular-nums;
      margin: 20px 0 10px;
    }

    .timer-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .timer-controls button,
    .small-action-btn {
      background: rgba(47, 88, 130, 0.34);
      border: 1.15px solid rgba(111, 201, 255, 0.52);
      color: rgba(229, 243, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .small-action-btn:hover {
      background: rgba(71, 124, 178, 0.5);
      color: rgba(238, 248, 255, 0.98);
      border-color: rgba(141, 217, 255, 0.72);
    }

    .timer-controls input {
      width: 72px;
      border-radius: 8px;
      border: 1px solid rgba(100, 200, 255, 0.3);
      background: rgba(12, 18, 30, 0.9);
      color: rgba(230, 240, 255, 0.95);
      padding: 6px;
      text-align: center;
    }

    .timer-label {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
    }

    /* Activity Widget */
    .activity-stat {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .activity-stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(100, 200, 255, 0.9);
      min-width: 56px;
      max-width: 82px;
      background: rgba(9, 14, 24, 0.85);
      border: 1px solid rgba(100, 200, 255, 0.25);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }

    .activity-stat-label {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(9, 14, 24, 0.85);
      border: 1px solid rgba(100, 200, 255, 0.2);
      border-radius: 8px;
      padding: 6px;
      flex: 1;
    }

    /* Calendar Widget */
    .calendar-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .calendar-month {
      font-size: 0.9rem;
      color: rgba(100, 200, 255, 0.8);
      text-align: center;
      font-weight: 600;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 4px;
    }

    .calendar-controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .calendar-selected {
      font-size: 0.75rem;
      color: rgba(180, 220, 255, 0.9);
      margin-top: 8px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .calendar-day.today {
      background: rgba(100, 200, 255, 0.3);
      color: rgba(100, 200, 255, 0.95);
      font-weight: 700;
    }

    .calendar-day.checked {
      background: rgba(100, 255, 150, 0.28);
      color: rgba(170, 255, 200, 0.95);
      font-weight: 700;
    }

    /* Todo Widget */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .todo-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(100, 200, 255, 0.5);
      background: transparent;
      cursor: pointer;
    }

    .todo-checkbox.checked {
      background: rgba(100, 200, 255, 0.6);
      border-color: rgba(100, 200, 255, 0.8);
    }

    /* Reminders Widget */
    .reminders-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      overflow: hidden;
    }

    .reminder-item {
      padding: 10px;
      border-radius: 8px;
      background: rgba(100, 200, 255, 0.15);
      border-left: 3px solid rgba(100, 200, 255, 0.8);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .widget-text-input,
    .widget-textarea,
    .widget-tag-input,
    .reminder-text-input,
    .reminder-time-input {
      width: 100%;
      border: 1px solid rgba(100, 200, 255, 0.25);
      background: rgba(9, 14, 24, 0.82);
      color: rgba(230, 240, 255, 0.95);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.84rem;
    }

    .widget-textarea {
      min-height: 72px;
      resize: vertical;
    }

    .reminder-time {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    .project-card {
      background: rgba(40, 40, 45, 0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: 0.5s ease;
      pointer-events: none;
    }

    .project-card:hover::before {
      left: 100%;
    }

    .project-card:hover {
      background: rgba(50, 50, 55, 0.7);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .project-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: white;
    }

    .project-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .project-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .project-progress {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #fff, rgba(255,255,255,0.6));
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .project-deadline {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      text-align: right;
    }

    /* Timeline Section */
    .timeline-section h2 {
      font-size: 1.5rem;
      margin-bottom: 0;
      color: white;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .top-right-logout-btn {
      border: 1.25px solid rgba(111, 201, 255, 0.54);
      background: rgba(47, 88, 130, 0.34);
      color: rgba(229, 243, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      position: relative;
      padding-left: 80px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(100, 200, 255, 0.5), rgba(255,255,255,0.2));
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 32px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -42px;
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(100, 200, 255, 0.6);
      border: 2px solid rgba(20, 21, 26, 1);
      z-index: 2;
      transition: all 0.3s ease;
    }

    .timeline-item:hover::before {
      width: 16px;
      height: 16px;
      left: -44px;
      top: 1px;
      background: rgba(100, 200, 255, 0.9);
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
    }

    .timeline-item.overdue::before {
      background: rgba(255, 100, 100, 0.6);
      border-color: rgba(20, 21, 26, 1);
    }

    .timeline-date {
      font-size: 1.2rem;
      font-weight: 600;
      color: rgba(100, 200, 255, 0.8);
      min-width: 70px;
      text-align: right;
      padding-right: 10px;
      letter-spacing: 1px;
    }

    .timeline-content {
      flex: 1;
      padding-top: 2px;
    }

    .timeline-task {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .timeline-project {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
      display: flex;
      gap: 8px;
    }

    .timeline-project::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      align-self: center;
    }

    /* Team Members Sidebar */
    .team-sidebar {
      background: transparent;
      border: none;
      border-radius: 14px;
      padding: 0;
      backdrop-filter: none;
      height: auto;
      max-height: none;
      overflow-y: visible;
      position: fixed;
      right: 40px;
      top: 150px;
      width: 320px;
      opacity: 1;
      pointer-events: auto;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .team-sidebar h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: white;
    }

    .team-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .team-member {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(60, 60, 65, 0.3);
      transition: all 0.3s ease;
    }

    .team-member:hover {
      background: rgba(60, 60, 65, 0.6);
    }

    .member-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .member-name {
      font-size: 0.9rem;
      color: white;
      flex: 1;
    }

    .member-role {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
    }

    /* Empty state */
    .empty-state {
      background: rgba(40, 40, 45, 0.5);
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 40px;
      text-align: center;
      color: rgba(255,255,255,0.6);
    }

    .empty-state p {
      font-size: 1rem;
      margin: 0;
    }

    /* Subtle pulse animation for today's date halo */
    @keyframes subtlePulse {
      0%, 100% { 
        box-shadow: 0 0 0 0 rgba(100, 200, 255, 0.3);
      }
      50% { 
        box-shadow: 0 0 0 2px rgba(100, 200, 255, 0.1);
      }
    }

    .timeline-item.today::before {
      background: rgba(100, 200, 255, 0.8);
      animation: subtlePulse 2s infinite;
      box-shadow: 0 0 0 0 rgba(100, 200, 255, 0.3);
    }

    /* Green styling for completed/past tasks */
    .timeline-item.completed::before {
      background: rgba(100, 255, 100, 0.6);
      border-color: rgba(20, 21, 26, 1);
    }

    .timeline-item.completed:hover::before {
      background: rgba(100, 255, 100, 0.9);
      box-shadow: 0 0 15px rgba(100, 255, 100, 0.5);
    }

    .timeline-item.completed .timeline-date {
      color: rgba(100, 255, 100, 0.8);
    }

    /* ================= EDIT MODE ================= */
    .edit-mode-active .project-card,
    .edit-mode-active .timeline-item,
    .edit-mode-active .team-member {
      cursor: text;
      position: relative;
    }

    .edit-mode-active .project-card:hover,
    .edit-mode-active .timeline-item:hover {
      border-color: rgba(100, 200, 255, 0.4) !important;
      background: rgba(50, 60, 80, 0.6) !important;
    }

    .project-title.editable,
    .project-desc.editable,
    .timeline-task.editable,
    .timeline-project.editable,
    .member-name.editable {
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(100, 200, 255, 0.3);
      padding: 4px 2px;
      transition: all 0.2s ease;
    }

    .project-title.editable:focus,
    .project-desc.editable:focus,
    .timeline-task.editable:focus,
    .timeline-project.editable:focus,
    .member-name.editable:focus {
      outline: none;
      border-bottom-color: rgba(100, 200, 255, 0.8);
      background: rgba(100, 200, 255, 0.05);
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .dashboard-container {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 30px 40px;
      }

      .team-sidebar {
        position: fixed;
      }

      .team-sidebar-toggle {
        position: fixed;
      }
    }

    @media (max-width: 768px) {
      .dashboard-container {
        margin-left: 70px;
        padding: 20px;
      }

      /* let flexbox handle stacking on narrow screens rather than forcing grid columns */
      /*
      .projects-grid,
      .widgets-grid {
        grid-template-columns: 1fr;
      }

      .widget.size-large,
      .widget.size-wide {
        grid-column: span 1;
      }

      .widget.size-tall {
        grid-row: span 1;
      }

      .widget {
        auto-rows: auto;
        min-height: 200px;
      }
      */
      /* widgets and projects will shrink naturally via flex rules */

      .widgets-workspace {
        max-height: none;
        padding: 10px;
      }

      .widgets-grid {
        --grid-cols: 4;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .dashboard-header h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 1100px) and (min-width: 769px) {
      .widgets-grid {
        --grid-cols: 8;
      }
    }
  </style>

<script>
  const user = localStorage.getItem("rolebit_user");

  const WIDGETS_STORAGE_KEY = "rolebit_dashboard_widgets_v2";

  const mockTimeline = [

  function safeParse(value, fallback) {
    try {
      return JSON.parse(value) || fallback;
    } catch (_err) {
      return fallback;
    }
  }

  function getGridColumns() {
    if (window.innerWidth <= 768) return 4;
    if (window.innerWidth <= 1100) return 8;
    return 12;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function formatDuration(totalSeconds) {
    const seconds = Math.max(0, totalSeconds);
    const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  function loadWidgets() {
    const fromStorage = safeParse(localStorage.getItem(WIDGETS_STORAGE_KEY), null);
    if (!Array.isArray(fromStorage) || !fromStorage.length) {
      return defaultWidgets();
    }
    return fromStorage;
  }

  let widgets = loadWidgets();
  let draggedId = null;
  let resizeState = null;
  let gridEventsBound = false;
  let resizeRafId = 0;

  function saveWidgets() {
    localStorage.setItem(WIDGETS_STORAGE_KEY, JSON.stringify(widgets));
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;");
  }

  function renderCalendarDays(widget) {
    const date = new Date();
    date.setDate(1);
    date.setMonth(date.getMonth() + (widget.monthOffset || 0));

    const year = date.getFullYear();
    const monthIndex = date.getMonth();
    const monthName = date.toLocaleString("default", { month: "long" });
    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
    const leadingBlanks = date.getDay();

    const selectedDate = widget.selectedDate || "";
    const parts = [];

    for (let i = 0; i < leadingBlanks; i += 1) {
      parts.push('<div class="calendar-day" aria-hidden="true"></div>');
    }

    for (let day = 1; day <= daysInMonth; day += 1) {
      const isoDate = `${year}-${String(monthIndex + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const isToday = isoDate === new Date().toISOString().slice(0, 10);
      const isSelected = isoDate === selectedDate;
      const classes = ["calendar-day"];
      if (isToday) classes.push("today");
      if (isSelected) classes.push("checked");
      parts.push(`<button class="${classes.join(" ")}" data-action="calendar-select-day" data-date="${isoDate}">${day}</button>`);
    }

    return {
      title: `${monthName} ${year}`,
      daysMarkup: parts.join("")
    };
  }

  function getWidgetMarkup(widget) {
    const redirectPage = getWidgetRedirectPage(widget);
    const redirectLabel = getWidgetRedirectLabel(widget);

    if (widget.type === "timer") {
      return `
        <div class="timer-display" data-timer-display="${widget.id}">${formatDuration(widget.state?.secondsLeft || 0)}</div>
        <div class="timer-label">Focus Session</div>
        <div class="timer-controls">
          <button type="button" data-action="timer-toggle">${widget.state?.isRunning ? "Pause" : "Start"}</button>
          <button type="button" data-action="timer-reset">Reset</button>
          <input type="number" min="1" max="180" value="25" data-action="timer-minutes" aria-label="Timer minutes">
          <button type="button" data-action="timer-apply">Set</button>
        </div>
        <div class="widget-footer-actions">
          <button type="button" class="small-action-btn" data-action="widget-open-page" data-page="${redirectPage}">${redirectLabel}</button>
        </div>
      `;
    }

    if (widget.type === "activity") {
      const stats = Array.isArray(widget.stats) ? widget.stats : [];
      return `
        <div class="reminders-list">
          ${stats.map((item, idx) => `
            <div class="activity-stat">
              <input class="activity-stat-value" value="${escapeHtml(item.value)}" data-action="activity-value" data-index="${idx}" aria-label="Activity value">
              <input class="activity-stat-label" value="${escapeHtml(item.label)}" data-action="activity-label" data-index="${idx}" aria-label="Activity label">
            </div>
          `).join("")}
          <button type="button" class="small-action-btn" data-action="activity-add">Add Stat</button>
          <div class="widget-footer-actions">
            <button type="button" class="small-action-btn" data-action="widget-open-page" data-page="${redirectPage}">${redirectLabel}</button>
          </div>
        </div>
      `;
    }

    if (widget.type === "task") {
      return `
        <input class="widget-text-input" value="${escapeHtml(widget.title)}" data-action="widget-title" aria-label="Task title">
        <textarea class="widget-textarea" data-action="task-description" aria-label="Task description">${escapeHtml(widget.description || "")}</textarea>
        <input class="widget-tag-input" value="${escapeHtml(widget.tags || "")}" data-action="task-tags" aria-label="Task tags">
        <div class="task-card-footer">
          ${(widget.tags || "").split(",").map((tag) => tag.trim()).filter(Boolean).slice(0, 4).map((tag) => `<span class="task-tag work">${escapeHtml(tag)}</span>`).join("")}
        </div>
        <div class="widget-footer-actions">
          <button type="button" class="small-action-btn" data-action="widget-open-page" data-page="${redirectPage}">${redirectLabel}</button>
        </div>
      `;
    }

    if (widget.type === "calendar") {
      const calendar = renderCalendarDays(widget);
      const selected = widget.selectedDate ? `Selected: ${widget.selectedDate}` : "Selected: none";
      return `
        <div class="calendar-container">
          <div class="calendar-controls">
            <button type="button" class="small-action-btn" data-action="calendar-prev">Prev</button>
            <button type="button" class="small-action-btn" data-action="calendar-next">Next</button>
            <button type="button" class="small-action-btn" data-action="calendar-open">Open</button>
            <input type="date" data-action="calendar-picker" style="display:none;">
          </div>
          <div class="calendar-month">${calendar.title}</div>
          <div class="calendar-grid">${calendar.daysMarkup}</div>
          <div class="calendar-selected">${selected}</div>
          <div class="widget-footer-actions">
            <button type="button" class="small-action-btn" data-action="widget-open-page" data-page="${redirectPage}">${redirectLabel}</button>
          </div>
        </div>
      `;
    }

    if (widget.type === "reminders") {
      const reminders = Array.isArray(widget.reminders) ? widget.reminders : [];
      return `
        <div class="reminders-list">
          ${reminders.map((item, idx) => `
            <div class="reminder-item">
              <input class="reminder-text-input" value="${escapeHtml(item.text)}" data-action="reminder-text" data-index="${idx}" aria-label="Reminder text">
              <input class="reminder-time-input" type="time" value="${escapeHtml(item.time)}" data-action="reminder-time" data-index="${idx}" aria-label="Reminder time">
            </div>
          `).join("")}
          <button type="button" class="small-action-btn" data-action="reminder-add">Add Reminder</button>
          <div class="widget-footer-actions">
            <button type="button" class="small-action-btn" data-action="widget-open-page" data-page="${redirectPage}">${redirectLabel}</button>
          </div>
        </div>
      `;
    }

    return "<div>Unsupported widget type.</div>";
  }

  function renderWidgets() {
    const grid = document.getElementById("widgetsGrid");
    const cols = getGridColumns();
    grid.style.setProperty("--grid-cols", String(cols));

    widgets.forEach((widget) => {
      const maxCols = cols;
      widget.w = clamp(widget.w || 4, widget.minW || 2, maxCols);
      widget.h = clamp(widget.h || 8, widget.minH || 5, 20);
    });

    grid.innerHTML = widgets.map((widget) => `
      <article class="widget ${widget.type}-widget" data-id="${widget.id}" draggable="true" style="--widget-accent:${widget.accent};--w:${widget.w};--h:${widget.h};">
        <div class="widget-header">
          <div class="widget-title">${escapeHtml(widget.title)}</div>
          <div class="widget-header-actions">
            <div class="widget-icon">${widget.icon || ""}</div>
            <button type="button" class="widget-remove-btn" data-action="remove-widget" title="Remove widget" aria-label="Remove widget">x</button>
          </div>
        </div>
        ${getWidgetMarkup(widget)}
        <div class="widget-resize-handle" title="Resize widget"></div>
      </article>
    `).join("");
  }

  function getWidgetRedirectPage(widget) {
    if (!widget) return "dashboard.html";
    if (widget.type === "task") {
      const title = String(widget.title || "").toLowerCase();
      return title.includes("meeting") ? "meeting-info.html" : "todo.html";
    }
    return WIDGET_REDIRECTS[widget.type] || "dashboard.html";
  }

  function getWidgetRedirectLabel(widget) {
    const target = getWidgetRedirectPage(widget);
    if (target === "meeting-info.html") return "Open Meeting Page";
    if (target === "todo.html") return "Open To-Do Page";
    if (target === "focus-timer.html") return "Open Focus Timer";
    if (target === "calendar.html") return "Open Calendar Page";
    if (target === "reminders.html") return "Open Reminders Page";
    if (target === "timeline.html") return "Open Timeline Page";
    return "Open Page";
  }

  function renderTimeline() {
    const timeline = document.getElementById("timelineList");
    timeline.innerHTML = mockTimeline.map((item) => `
      <div class="timeline-item ${item.status}">
        <div class="timeline-date">${item.date}</div>
        <div class="timeline-content">
          <div class="timeline-task">${item.task}</div>
          <div class="timeline-project">in ${item.project}</div>
        </div>
      </div>
    `).join("");
  }

  function displayMotivationalMessage() {
    const messages = [
      "Progress over perfection. Let's keep going!",
      "Stay focused and stack small wins.",
      "Keep moving. Momentum builds results.",
      "Consistency beats intensity.",
      "You are closer than you think."
    ];
    const idx = Math.floor(Math.random() * messages.length);
    const target = document.getElementById("heroMotivational");
    if (target) target.textContent = messages[idx];
  }

  function updateWidgetsFromDomOrder() {
    const ids = Array.from(document.querySelectorAll("#widgetsGrid .widget")).map((el) => el.dataset.id);
    widgets.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
    saveWidgets();
  }

  function getDragAfterElement(container, mouseX, mouseY) {
    const elements = Array.from(container.querySelectorAll(".widget:not(.dragging)"));
    let target = null;
    let targetScore = Number.POSITIVE_INFINITY;

    elements.forEach((element) => {
      const rect = element.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dy = mouseY - centerY;
      const dx = mouseX - centerX;
      const score = Math.abs(dy) * 2 + Math.abs(dx);
      if (dy < 0 && score < targetScore) {
        targetScore = score;
        target = element;
      }
    });

    return target;
  }

  function findWidgetByElement(element) {
    if (!element) return null;
    return widgets.find((widget) => widget.id === element.dataset.id) || null;
  }

  function bindDragAndResize() {
    const grid = document.getElementById("widgetsGrid");

    grid.querySelectorAll(".widget").forEach((widgetEl) => {
      widgetEl.addEventListener("dragstart", (event) => {
        if (event.target.closest("input,textarea,button,.widget-resize-handle")) {
          event.preventDefault();
          return;
        }
        draggedId = widgetEl.dataset.id;
        widgetEl.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
      });

      widgetEl.addEventListener("dragend", () => {
        widgetEl.classList.remove("dragging");
        grid.querySelectorAll(".widget").forEach((item) => item.classList.remove("drag-over"));
        if (draggedId) {
          updateWidgetsFromDomOrder();
        }
        draggedId = null;
      });
    });

    if (!gridEventsBound) {
      grid.addEventListener("dragover", (event) => {
        event.preventDefault();
        const dragging = grid.querySelector(".widget.dragging");
        if (!dragging) return;
        const afterElement = getDragAfterElement(grid, event.clientX, event.clientY);
        grid.querySelectorAll(".widget").forEach((item) => item.classList.remove("drag-over"));

        if (!afterElement) {
          grid.appendChild(dragging);
        } else {
          afterElement.classList.add("drag-over");
          grid.insertBefore(dragging, afterElement);
        }
      });

      grid.addEventListener("drop", (event) => {
        event.preventDefault();
        updateWidgetsFromDomOrder();
      });

      gridEventsBound = true;
    }

    grid.querySelectorAll(".widget-resize-handle").forEach((handle) => {
      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        const widgetEl = handle.closest(".widget");
        const widget = findWidgetByElement(widgetEl);
        if (!widget || !widgetEl) return;

        const cols = getGridColumns();
        const cellWidth = (grid.clientWidth - (cols - 1) * GRID_GAP) / cols;
        resizeState = {
          id: widget.id,
          startX: event.clientX,
          startY: event.clientY,
          startW: widget.w,
          startH: widget.h,
          cellUnitX: cellWidth + GRID_GAP,
          cellUnitY: ROW_UNIT + GRID_GAP,
          minW: widget.minW || 2,
          minH: widget.minH || 5,
          maxW: cols,
          nextW: widget.w,
          nextH: widget.h
        };
        widgetEl.classList.add("widget-resizing");
        handle.setPointerCapture(event.pointerId);
      });
    });
  }

  function addWidget(type) {
    const now = Date.now();
    const id = `w-${type}-${now}`;
    const base = {
      id,
      type,
      w: 4,
      h: 9,
      minW: 3,
      minH: 7,
      accent: "rgba(100, 200, 255, 0.8)",
      title: "New Widget",
      icon: "✨"
    };

    if (type === "timer") {
      widgets.push({ ...base, title: "Focus Timer", icon: "⏱️", state: { secondsLeft: 1500, isRunning: false } });
    } else if (type === "calendar") {
      widgets.push({ ...base, title: "Calendar", icon: "📅", selectedDate: "", monthOffset: 0 });
    } else if (type === "activity") {
      widgets.push({ ...base, title: "Activity", icon: "📊", stats: [{ value: "0", label: "Metric" }] });
    } else if (type === "reminders") {
      widgets.push({ ...base, title: "Reminders", icon: "🔔", reminders: [{ text: "New reminder", time: "09:00" }] });
    } else {
      widgets.push({ ...base, type: "task", title: "Task Card", icon: "📝", description: "Add details", tags: "work" });
    }

    saveWidgets();
    rerenderAllWidgets();
  }

  function rerenderAllWidgets() {
    renderWidgets();
    bindDragAndResize();
  }

  document.addEventListener("pointermove", (event) => {
    if (!resizeState) return;

    const deltaX = event.clientX - resizeState.startX;
    const deltaY = event.clientY - resizeState.startY;
    const w = clamp(Math.round(resizeState.startW + deltaX / resizeState.cellUnitX), resizeState.minW, resizeState.maxW);
    const h = clamp(Math.round(resizeState.startH + deltaY / resizeState.cellUnitY), resizeState.minH, 20);

    if (w === resizeState.nextW && h === resizeState.nextH) return;
    resizeState.nextW = w;
    resizeState.nextH = h;

    if (resizeRafId) return;
    resizeRafId = window.requestAnimationFrame(() => {
      resizeRafId = 0;
      if (!resizeState) return;
      const widgetEl = document.querySelector(`.widget[data-id="${resizeState.id}"]`);
      if (!widgetEl) return;
      widgetEl.style.setProperty("--w", String(resizeState.nextW));
      widgetEl.style.setProperty("--h", String(resizeState.nextH));
    });
  });

  document.addEventListener("pointerup", () => {
    if (!resizeState) return;

    if (resizeRafId) {
      window.cancelAnimationFrame(resizeRafId);
      resizeRafId = 0;
    }

    const widgetEl = document.querySelector(`.widget[data-id="${resizeState.id}"]`);
    const widget = widgets.find((item) => item.id === resizeState.id);
    if (widgetEl && widget) {
      widgetEl.classList.remove("widget-resizing");
      widget.w = resizeState.nextW || widget.w;
      widget.h = resizeState.nextH || widget.h;
      widgetEl.style.setProperty("--w", String(widget.w));
      widgetEl.style.setProperty("--h", String(widget.h));
      saveWidgets();
    }
    resizeState = null;
  });

  document.addEventListener("input", (event) => {
    const action = event.target.dataset.action;
    const widgetEl = event.target.closest(".widget");
    if (!widgetEl || !action) return;
    const widget = findWidgetByElement(widgetEl);
    if (!widget) return;

    if (action === "widget-title") {
      widget.title = event.target.value;
      const titleEl = widgetEl.querySelector(".widget-title");
      if (titleEl) titleEl.textContent = widget.title;
    }

    if (action === "task-description") {
      widget.description = event.target.value;
    }

    if (action === "task-tags") {
      widget.tags = event.target.value;
    }

    if (action === "activity-value" || action === "activity-label") {
      const idx = Number(event.target.dataset.index || 0);
      if (!widget.stats || !widget.stats[idx]) return;
      if (action === "activity-value") widget.stats[idx].value = event.target.value;
      if (action === "activity-label") widget.stats[idx].label = event.target.value;
    }

    if (action === "reminder-text" || action === "reminder-time") {
      const idx = Number(event.target.dataset.index || 0);
      if (!widget.reminders || !widget.reminders[idx]) return;
      if (action === "reminder-text") widget.reminders[idx].text = event.target.value;
      if (action === "reminder-time") widget.reminders[idx].time = event.target.value;
    }

    saveWidgets();
  });

  document.addEventListener("click", (event) => {
    const actionEl = event.target.closest("[data-action]");
    if (!actionEl) return;

    const action = actionEl.dataset.action;
    const widgetEl = actionEl.closest(".widget");
    const widget = findWidgetByElement(widgetEl);

    if (action === "remove-widget" && widget) {
      widgets = widgets.filter((item) => item.id !== widget.id);
      saveWidgets();
      rerenderAllWidgets();
      return;
    }

    if (action === "timer-toggle" && widget?.type === "timer") {
      widget.state.isRunning = !widget.state.isRunning;
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "timer-reset" && widget?.type === "timer") {
      widget.state.isRunning = false;
      widget.state.secondsLeft = 1500;
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "timer-apply" && widget?.type === "timer") {
      const minutesInput = widgetEl.querySelector('[data-action="timer-minutes"]');
      const minutes = clamp(Number(minutesInput?.value || 25), 1, 180);
      widget.state.secondsLeft = minutes * 60;
      widget.state.isRunning = false;
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "calendar-prev" && widget?.type === "calendar") {
      widget.monthOffset = (widget.monthOffset || 0) - 1;
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "calendar-next" && widget?.type === "calendar") {
      widget.monthOffset = (widget.monthOffset || 0) + 1;
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "calendar-open" && widget?.type === "calendar") {
      const picker = widgetEl.querySelector('[data-action="calendar-picker"]');
      if (picker) picker.showPicker ? picker.showPicker() : picker.click();
    }

    if (action === "calendar-select-day" && widget?.type === "calendar") {
      widget.selectedDate = actionEl.dataset.date || "";
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "activity-add" && widget?.type === "activity") {
      widget.stats = widget.stats || [];
      widget.stats.push({ value: "0", label: "New metric" });
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "reminder-add" && widget?.type === "reminders") {
      widget.reminders = widget.reminders || [];
      widget.reminders.push({ text: "New reminder", time: "09:00" });
      saveWidgets();
      rerenderAllWidgets();
    }

    if (action === "widget-open-page") {
      const targetPage = actionEl.dataset.page || getWidgetRedirectPage(widget);
      if (targetPage) {
        window.location.href = targetPage;
      }
    }

    if (action === "open-timeline-page") {
      window.location.href = "timeline.html";
    }
  });

  document.addEventListener("change", (event) => {
    const action = event.target.dataset.action;
    if (action !== "calendar-picker") return;
    const widgetEl = event.target.closest(".widget");
    const widget = findWidgetByElement(widgetEl);
    if (!widget || widget.type !== "calendar") return;

    widget.selectedDate = event.target.value;
    widget.monthOffset = 0;
    if (widget.selectedDate) {
      const selected = new Date(widget.selectedDate + "T00:00:00");
      const now = new Date();
      widget.monthOffset = (selected.getFullYear() - now.getFullYear()) * 12 + (selected.getMonth() - now.getMonth());
    }
    saveWidgets();
    rerenderAllWidgets();
  });

  function tickTimers() {
    let changed = false;
    widgets.forEach((widget) => {
      if (widget.type !== "timer" || !widget.state?.isRunning) return;
      if (widget.state.secondsLeft > 0) {
        widget.state.secondsLeft -= 1;
        changed = true;
      }
      if (widget.state.secondsLeft <= 0) {
        widget.state.secondsLeft = 0;
        widget.state.isRunning = false;
      }
    });

    if (!changed) return;
    document.querySelectorAll("[data-timer-display]").forEach((display) => {
      const widget = widgets.find((item) => item.id === display.dataset.timerDisplay);
      if (widget?.type === "timer") {
        display.textContent = formatDuration(widget.state.secondsLeft);
      }
    });
    saveWidgets();
  }

  function updateGreeting() {
    const nameEl = document.getElementById("heroName");
    const prefixEl = document.querySelector(".hero-greeting-prefix");
    if (nameEl) nameEl.textContent = user || "User";
    if (prefixEl) prefixEl.textContent = "Good Morning, ";
  }

  document.getElementById("addWidgetBtn")?.addEventListener("click", () => {
    const type = document.getElementById("widgetTypeSelect")?.value || "task";
    addWidget(type);
  });

  window.addEventListener("resize", () => {
    rerenderAllWidgets();
  });

  updateGreeting();
  displayMotivationalMessage();
  renderTimeline();
  rerenderAllWidgets();
  initGithubDashboard({ containerId: "dashboardGithubArea" });
  window.setInterval(tickTimers, 1000);
</script>

</body>
</html>
