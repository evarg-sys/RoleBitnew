<!DOCTYPE html>
<html>
<head>
  <title>Rolebit – Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dashboard-specific styles */
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-left: 70px;
      padding: 40px 60px;
      min-height: 100vh;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sidebar:hover ~ .dashboard-container {
      margin-left: 220px;
    }


    .dashboard-main {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dashboard-header h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dashboard-header .logout-btn,
    .dashboard-header .edit-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }

    .dashboard-header .edit-btn {
      background: rgba(100, 200, 255, 0.15);
      border-color: rgba(100, 200, 255, 0.3);
    }

    .dashboard-header .edit-btn.active {
      background: rgba(100, 200, 255, 0.3);
      border-color: rgba(100, 200, 255, 0.5);
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
    }

    .dashboard-header .logout-btn:hover,
    .dashboard-header .edit-btn:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 12px rgba(255,255,255,0.2);
    }

    /* Projects Section */
    .projects-section h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: white;
    }

    .add-project-btn {
      background: rgba(100, 200, 255, 0.2);
      border: 1px solid rgba(100, 200, 255, 0.4);
      color: rgba(100, 200, 255, 0.95);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .add-project-btn:hover {
      background: rgba(100, 200, 255, 0.3);
      border-color: rgba(100, 200, 255, 0.6);
      box-shadow: 0 0 12px rgba(100, 200, 255, 0.25);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    /* Widget Grid - Masonry style */
    .widgets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      auto-rows: 250px;
    }

    .widget {
      background: rgba(40, 50, 80, 0.6);
      border: 1px solid rgba(100, 200, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(15px);
      transition: all 0.3s ease;
      cursor: grab;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      user-select: none;
    }

    .widget:active {
      cursor: grabbing;
    }

    .widget.dragging {
      opacity: 0.6;
      z-index: 1000;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.5);
    }

    .widget.drag-over {
      opacity: 0.3;
      border: 2px dashed rgba(100, 200, 255, 0.9) !important;
      background: rgba(60, 100, 150, 1) !important;
      transform: scale(1.02);
    }

    .widget::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--widget-accent, rgba(100, 200, 255, 0.8));
    }

    .widget:hover {
      background: rgba(60, 80, 120, 0.8);
      border-color: rgba(100, 200, 255, 0.3);
      box-shadow: 0 0 30px rgba(100, 200, 255, 0.3),
                  inset 0 1px 10px rgba(100, 200, 255, 0.1);
      transform: translateY(-4px);
    }

    /* Widget size variants */
    .widget.size-large {
      min-height: 440px;
    }

    .widget.size-tall {
      min-height: 420px;
    }

    .widget.size-wide {
      /* sizing handled by flexbox in CSS */
    }

    .widget.size-small {
      /* sizing handled by flexbox in CSS */
    }

    /* Editable widgets */
    .widget[data-editable="true"] {
      cursor: pointer;
    }

    .widget[data-editable="true"]:hover {
      border-color: rgba(100, 200, 255, 0.4);
    }

    .editing-text {
      position: relative;
    }

    .editing-text:hover {
      background: rgba(100, 200, 255, 0.1);
      border-radius: 4px;
      padding: 2px 4px;
      cursor: text;
    }

    .editing-text.editing {
      background: rgba(100, 200, 255, 0.15);
      border-radius: 4px;
      padding: 2px 4px;
      outline: 1px solid rgba(100, 200, 255, 0.4);
      outline-offset: 1px;
    }

    .editing-text.editing:focus {
      outline: 2px solid rgba(100, 200, 255, 0.6);
      outline-offset: 1px;
    }

    /* Prevent editing text from blocking drag */
    .widget.dragging .editing-text {
      pointer-events: none;
    }

    /* Widget header */
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .widget-title {
      font-size: 1rem;
      font-weight: 700;
      color: white;
    }

    .widget-icon {
      font-size: 1.5rem;
      opacity: 0.7;
    }

    /* Timer Widget */
    .timer-display {
      font-size: 3.5rem;
      font-weight: 700;
      text-align: center;
      color: rgba(100, 200, 255, 0.9);
      font-variant-numeric: tabular-nums;
      margin: auto 0;
    }

    .timer-label {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
    }

    /* Activity Widget */
    .activity-stat {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .activity-stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: rgba(100, 200, 255, 0.9);
      min-width: 50px;
    }

    .activity-stat-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Max size constraints for specific widgets */
    .widget.timer-widget.size-small,
    .widget.activity-widget.size-tall {
      max-width: 300px;
    }

    /* Calendar Widget */
    .calendar-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .calendar-month {
      font-size: 0.9rem;
      color: rgba(100, 200, 255, 0.8);
      text-align: center;
      font-weight: 600;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.2s;
    }

    .calendar-day.today {
      background: rgba(100, 200, 255, 0.3);
      color: rgba(100, 200, 255, 0.95);
      font-weight: 700;
    }

    /* Todo Widget */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .todo-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(100, 200, 255, 0.5);
      background: transparent;
      cursor: pointer;
    }

    .todo-checkbox.checked {
      background: rgba(100, 200, 255, 0.6);
      border-color: rgba(100, 200, 255, 0.8);
    }

    /* Reminders Widget */
    .reminders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    .reminder-item {
      padding: 10px;
      border-radius: 8px;
      background: rgba(100, 200, 255, 0.15);
      border-left: 3px solid rgba(100, 200, 255, 0.8);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .reminder-time {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    .project-card {
      background: rgba(40, 40, 45, 0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: 0.5s ease;
      pointer-events: none;
    }

    .project-card:hover::before {
      left: 100%;
    }

    .project-card:hover {
      background: rgba(50, 50, 55, 0.7);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .project-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: white;
    }

    .project-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .project-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .project-progress {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #fff, rgba(255,255,255,0.6));
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .project-deadline {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      text-align: right;
    }

    /* Timeline Section */
    .timeline-section h2 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      color: white;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      position: relative;
      padding-left: 80px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(100, 200, 255, 0.5), rgba(255,255,255,0.2));
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 32px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -42px;
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(100, 200, 255, 0.6);
      border: 2px solid rgba(20, 21, 26, 1);
      z-index: 2;
      transition: all 0.3s ease;
    }

    .timeline-item:hover::before {
      width: 16px;
      height: 16px;
      left: -44px;
      top: 1px;
      background: rgba(100, 200, 255, 0.9);
      box-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
    }

    .timeline-item.overdue::before {
      background: rgba(255, 100, 100, 0.6);
      border-color: rgba(20, 21, 26, 1);
    }

    .timeline-date {
      font-size: 1.2rem;
      font-weight: 600;
      color: rgba(100, 200, 255, 0.8);
      min-width: 70px;
      text-align: right;
      padding-right: 10px;
      letter-spacing: 1px;
    }

    .timeline-content {
      flex: 1;
      padding-top: 2px;
    }

    .timeline-task {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .timeline-project {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
      display: flex;
      gap: 8px;
    }

    .timeline-project::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      align-self: center;
    }

    /* Team Members Sidebar */
    .team-sidebar {
      background: transparent;
      border: none;
      border-radius: 14px;
      padding: 0;
      backdrop-filter: none;
      height: auto;
      max-height: none;
      overflow-y: visible;
      position: fixed;
      right: 40px;
      top: 150px;
      width: 320px;
      opacity: 1;
      pointer-events: auto;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .team-sidebar h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: white;
    }

    .team-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .team-member {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(60, 60, 65, 0.3);
      transition: all 0.3s ease;
    }

    .team-member:hover {
      background: rgba(60, 60, 65, 0.6);
    }

    .member-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .member-name {
      font-size: 0.9rem;
      color: white;
      flex: 1;
    }

    .member-role {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
    }

    /* Empty state */
    .empty-state {
      background: rgba(40, 40, 45, 0.5);
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 40px;
      text-align: center;
      color: rgba(255,255,255,0.6);
    }

    .empty-state p {
      font-size: 1rem;
      margin: 0;
    }

    /* Subtle pulse animation for today's date halo */
    @keyframes subtlePulse {
      0%, 100% { 
        box-shadow: 0 0 0 0 rgba(100, 200, 255, 0.3);
      }
      50% { 
        box-shadow: 0 0 0 2px rgba(100, 200, 255, 0.1);
      }
    }

    .timeline-item.today::before {
      background: rgba(100, 200, 255, 0.8);
      animation: subtlePulse 2s infinite;
      box-shadow: 0 0 0 0 rgba(100, 200, 255, 0.3);
    }

    /* Green styling for completed/past tasks */
    .timeline-item.completed::before {
      background: rgba(100, 255, 100, 0.6);
      border-color: rgba(20, 21, 26, 1);
    }

    .timeline-item.completed:hover::before {
      background: rgba(100, 255, 100, 0.9);
      box-shadow: 0 0 15px rgba(100, 255, 100, 0.5);
    }

    .timeline-item.completed .timeline-date {
      color: rgba(100, 255, 100, 0.8);
    }

    /* ================= EDIT MODE ================= */
    .edit-mode-active .project-card,
    .edit-mode-active .timeline-item,
    .edit-mode-active .team-member {
      cursor: text;
      position: relative;
    }

    .edit-mode-active .project-card:hover,
    .edit-mode-active .timeline-item:hover {
      border-color: rgba(100, 200, 255, 0.4) !important;
      background: rgba(50, 60, 80, 0.6) !important;
    }

    .project-title.editable,
    .project-desc.editable,
    .timeline-task.editable,
    .timeline-project.editable,
    .member-name.editable {
      background: transparent;
      border: none;
      border-bottom: 2px solid rgba(100, 200, 255, 0.3);
      padding: 4px 2px;
      transition: all 0.2s ease;
    }

    .project-title.editable:focus,
    .project-desc.editable:focus,
    .timeline-task.editable:focus,
    .timeline-project.editable:focus,
    .member-name.editable:focus {
      outline: none;
      border-bottom-color: rgba(100, 200, 255, 0.8);
      background: rgba(100, 200, 255, 0.05);
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .dashboard-container {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 30px 40px;
      }

      .team-sidebar {
        position: fixed;
      }

      .team-sidebar-toggle {
        position: fixed;
      }
    }

    @media (max-width: 768px) {
      .dashboard-container {
        margin-left: 70px;
        padding: 20px;
      }

      .projects-grid,
      .widgets-grid {
        grid-template-columns: 1fr;
      }

      .widget.size-large,
      .widget.size-wide {
        grid-column: span 1;
      }

      .widget.size-tall {
        grid-row: span 1;
      }

      .widget {
        auto-rows: auto;
        min-height: 200px;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .dashboard-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

  // Widget editing functionality
  function setupWidgetEditing() {
    const editableTexts = document.querySelectorAll(".editing-text");
    
    editableTexts.forEach(textElement => {
      textElement.addEventListener("click", function(e) {
        e.stopPropagation();
        
        // Skip if already editing
        if (this.getAttribute("contenteditable") === "true") return;
        
        const originalText = this.innerText;
        const field = this.getAttribute("data-field");
        
        // Make content editable
        this.contentEditable = true;
        this.classList.add("editing");
        this.focus();
        
        // Select all text
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(this);
        sel.removeAllRanges();
        sel.addRange(range);
        
        // Handle blur (finish editing)
        const finishEdit = () => {
          this.contentEditable = false;
          this.classList.remove("editing");
          
          const newText = this.innerText.trim();
          if (newText && newText !== originalText) {
            // Save the new text to the mock data
            const widget = mockWidgets.find(w => w.id === this.closest(".widget")?.dataset.id);
            if (widget && field) {
              widget[field] = newText;
            }
          } else if (!newText) {
            // If empty, revert to original
            this.innerText = originalText;
          }
          
          this.removeEventListener("blur", finishEdit);
        };
        
        this.addEventListener("blur", finishEdit);
        
        // Handle Enter key (finish editing)
        this.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            this.blur();
          } else if (e.key === "Escape") {
            e.preventDefault();
            this.innerText = originalText;
            this.blur();
          }
        }, { once: true });
      });
    });
  }

  // Widget drag and drop functionality
  let draggedWidget = null;

  function setupWidgetDragAndDrop() {
    const widgets = document.querySelectorAll(".widget");
    
    widgets.forEach((widget) => {
      // Ensure draggable is enabled
      widget.setAttribute("draggable", "true");
      
      widget.addEventListener("dragstart", (e) => {
        draggedWidget = widget;
        widget.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      }, false);

      widget.addEventListener("dragend", (e) => {
        document.querySelectorAll(".widget").forEach(w => {
          w.classList.remove("dragging", "drag-over");
        });
        draggedWidget = null;
      }, false);

      widget.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        
        if (widget !== draggedWidget) {
          widget.classList.add("drag-over");
        }
      }, false);

      widget.addEventListener("dragleave", (e) => {
        widget.classList.remove("drag-over");
      }, false);

      widget.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        if (widget !== draggedWidget && draggedWidget) {
          const draggedId = parseInt(draggedWidget.dataset.id);
          const targetId = parseInt(widget.dataset.id);
          
          const draggedIndex = mockWidgets.findIndex(w => w.id === draggedId);
          const targetIndex = mockWidgets.findIndex(w => w.id === targetId);
          
          if (draggedIndex !== -1 && targetIndex !== -1) {
            [mockWidgets[draggedIndex], mockWidgets[targetIndex]] = [mockWidgets[targetIndex], mockWidgets[draggedIndex]];
            renderWidgets();
          }
        }
      }, false);
    });
  }
