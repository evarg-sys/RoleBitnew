    <span id="welcome" class="home-welcome"></span>
    <button id="homeDashboardBtn" class="home-dashboard-btn" onclick="goDashboard()" style="display:none">Dashboard</button>
    <button id="logoutBtn" class="home-logout-btn" onclick="logout()" style="display:none">Logout</button>

<script>
  // Show dashboard tab if user is logged in as admin
  function updateSidebarForAdmin() {
    const isLoggedIn = localStorage.getItem('rolebit_user');
    const isAdmin = localStorage.getItem('rolebit_admin');
    const dashboardTab = document.getElementById('dashboardTab');
    
    if (isLoggedIn && isAdmin === 'true') {
      dashboardTab.style.display = 'block';
    }
  }
  
  // Check on page load
  updateSidebarForAdmin();
  
  // Also check periodically in case admin status changes
  window.addEventListener('storage', updateSidebarForAdmin);
</script>


<div class="main hero">
  <h1>ROLEBIT</h1>
  <p>AI-powered collaboration for group projects.</p>
  <p>Assign tasks. Track effort. Win together.</p>
</div>
