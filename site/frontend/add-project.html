<!DOCTYPE html>
<html>
<head>
  <title>Rolebit - Add Project</title>
  <link rel="stylesheet" href="style.css">
  <script src="page-loader.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@500;700&display=swap');

    :root {
      --txt: #f6fbff;
      --muted: rgba(208, 228, 244, 0.78);
      --shell: rgba(18, 29, 49, 0.84);
      --line: rgba(118, 216, 255, 0.28);
      --card: rgba(8, 17, 31, 0.84);
    }

    html {
      min-height: 100%;
      background: #050807;
    }

    body {
      min-height: 100%;
      background: transparent;
      position: relative;
      isolation: isolate;
      color: var(--txt);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(18, 55, 35, 0.48), transparent 36%),
        radial-gradient(circle at 74% 22%, rgba(35, 95, 70, 0.16), transparent 32%),
        radial-gradient(circle at 84% 82%, rgba(12, 42, 25, 0.42), transparent 38%),
        linear-gradient(180deg, #070a08, #040606);
      background-size: 160% 160%;
      animation: calmGradientDrift 90s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes calmGradientDrift {
      0% { background-position: 0% 0%, 80% 20%, 100% 100%, 50% 50%; }
      50% { background-position: 30% 10%, 60% 40%, 70% 80%, 50% 50%; }
      100% { background-position: 60% 20%, 40% 60%, 40% 60%, 50% 50%; }
    }

    .sidebar {
      left: 12px;
      top: 12px;
      height: calc(100vh - 24px);
      border-radius: 26px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(13, 22, 39, 0.95), rgba(10, 16, 30, 0.95));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .sidebar a {
      border-radius: 999px;
      margin: 6px 0;
      border: 1px solid transparent;
    }

    .sidebar a:hover {
      border-color: var(--line);
      background: rgba(17, 43, 68, 0.8);
    }

    .page-wrap {
      margin-left: 84px;
      padding: 30px;
      min-height: 100vh;
      transition: margin-left 0.35s ease;
    }

    .sidebar:hover ~ .page-wrap {
      margin-left: 234px;
    }

    .panel {
      background: var(--shell);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.34);
      max-width: 1100px;
      margin: 0 auto;
    }

    .title {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      font-size: 2rem;
    }

    .subtitle {
      color: var(--muted);
      margin: 8px 0 16px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.95rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: rgba(191, 219, 246, 0.88);
      font-size: 0.82rem;
      font-family: 'Manrope', sans-serif;
    }

    .field input,
    .field select,
    .field textarea {
      border: 1px solid rgba(130, 202, 255, 0.3);
      background: rgba(8, 14, 28, 0.88);
      color: rgba(236, 246, 255, 0.96);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.9rem;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
    }

    .members-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      border: 1px solid rgba(130, 202, 255, 0.2);
      border-radius: 10px;
      padding: 8px;
      background: rgba(8, 14, 28, 0.55);
      max-height: 170px;
      overflow: auto;
    }

    .member-option {
      display: flex;
      gap: 7px;
      align-items: center;
      font-size: 0.82rem;
      color: rgba(217, 235, 252, 0.92);
    }

    .member-add-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
    }

    .member-empty {
      border: 1px dashed rgba(130, 202, 255, 0.24);
      border-radius: 10px;
      padding: 10px;
      color: rgba(194, 230, 255, 0.82);
      font-size: 0.82rem;
      font-family: 'Manrope', sans-serif;
      background: rgba(8, 14, 28, 0.35);
    }

    .timeline-note {
      border: 1px solid rgba(118, 216, 255, 0.24);
      border-radius: 12px;
      background: rgba(9, 17, 31, 0.74);
      padding: 12px;
      color: rgba(218, 236, 252, 0.9);
      font-size: 0.88rem;
      font-family: 'Manrope', sans-serif;
    }

    .pill-btn {
      border: 1.25px solid rgba(111, 201, 255, 0.54);
      background: rgba(47, 88, 130, 0.34);
      color: rgba(229, 243, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn.primary {
      background: rgba(67, 118, 170, 0.54);
      border-color: rgba(141, 217, 255, 0.72);
      color: rgba(238, 248, 255, 0.98);
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .feedback {
      margin-top: 10px;
      font-size: 0.86rem;
      color: rgba(194, 230, 255, 0.9);
      min-height: 20px;
      font-family: 'Manrope', sans-serif;
    }

    @media (max-width: 860px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .page-wrap {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <img src="logo.png" class="logo-img" alt="Rolebit Logo">
    <a href="dashboard.html">Dashboard</a>
    <a href="my-projects.html">My Projects</a>
    <a href="calendar.html">Calendar</a>
    <a href="timeline.html">Timeline</a>
    <a href="index.html">Home</a>

    <div class="signin-logo">
      <a href="#" onclick="logout(); return false;" title="Logout">L</a>
    </div>
  </div>

  <main class="page-wrap">
    <section class="panel">
      <h1 class="title">Create Project</h1>
      <p class="subtitle">Set project details, add members, pick priority and course, then manage timeline updates on the dedicated Timeline page.</p>

      <form id="projectForm" novalidate>
        <div class="form-grid">
          <label class="field">
            Project Name
            <input id="projectTitle" type="text" required placeholder="Rolebit Team Hub">
          </label>
          <label class="field">
            Status
            <input id="projectStatus" type="text" value="Planning" placeholder="Planning">
          </label>
          <label class="field">
            Deadline
            <input id="projectDeadline" type="date">
          </label>
          <label class="field">
            Progress
            <input id="projectProgress" type="number" min="0" max="100" value="0">
          </label>
          <label class="field">
            Visibility
            <select id="projectVisibility">
              <option value="private">Private</option>
              <option value="shared">Shared</option>
            </select>
          </label>
          <label class="field">
            Lifecycle
            <select id="projectLifecycle">
              <option value="Planning">Planning</option>
              <option value="Execution">Execution</option>
              <option value="Review">Review</option>
              <option value="Done">Done</option>
            </select>
          </label>
          <label class="field">
            Priority
            <select id="projectPriority">
              <option value="Priority: Low">Low</option>
              <option value="Priority: Medium" selected>Medium</option>
              <option value="Priority: High">High</option>
              <option value="Priority: Urgent">Urgent</option>
            </select>
          </label>
          <label class="field">
            Course
            <select id="projectCourse">
              <option value="General Studies">General Studies</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Software Engineering">Software Engineering</option>
              <option value="Data Science">Data Science</option>
              <option value="Information Systems">Information Systems</option>
              <option value="Business">Business</option>
              <option value="Mathematics">Mathematics</option>
              <option value="Biology">Biology</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Physics">Physics</option>
            </select>
          </label>
          <label class="field">
            Risk
            <input id="projectRisk" type="text" value="Risk: None">
          </label>
          <label class="field full">
            Git Repository URL
            <input id="projectGitRepo" type="url" placeholder="https://github.com/org/repo">
          </label>
          <label class="field">
            Git Branch
            <input id="projectGitBranch" type="text" value="main" placeholder="main">
          </label>
          <label class="field">
            Git Notes
            <input id="projectGitNotes" type="text" placeholder="Last synced commit, PR, or notes">
          </label>
          <label class="field full">
            Summary / Description
            <textarea id="projectSummary" placeholder="Describe the project and success criteria (optional)."></textarea>
          </label>
          <label class="field full">
            Project Members
            <div class="member-add-row">
              <input id="memberInput" type="text" placeholder="Add member username (example: mahesh.sharma)">
              <button id="addMemberBtn" class="pill-btn" type="button">Add Member</button>
            </div>
            <div id="membersPicker" class="members-picker"></div>
            <div id="membersEmpty" class="member-empty" style="display:none;">No members found yet. Add teammates manually above.</div>
          </label>
          <div class="field full">
            Timeline Updates
            <div class="timeline-note">
              Timeline is managed on its own page so students can focus on assignments and due dates there.
              <div style="margin-top:10px;">
                <button class="pill-btn" type="button" onclick="window.location.href='timeline.html'">Open Timeline Page</button>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="createProjectBtn" class="pill-btn primary" type="button">Create Project</button>
          <button class="pill-btn" type="button" onclick="window.location.href='my-projects.html'">Cancel</button>
        </div>
        <div id="formFeedback" class="feedback"></div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    const user = localStorage.getItem("rolebit_user");
    if (!user) {
      window.location.href = "signin.html";
    }

    const PROJECTS_API = "http://localhost:3000";
    let users = [];
    let manualMembers = [];

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeUsername(value) {
      return String(value || "").trim();
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 5000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    function selectedMembers() {
      const selected = Array.from(document.querySelectorAll(".member-check:checked")).map((el) => el.value);
      if (!selected.includes(user)) {
        selected.push(user);
      }
      return selected;
    }

    function dedupeMemberList(list) {
      const bucket = new Set();
      list.forEach((item) => {
        const normalized = normalizeUsername(item);
        if (normalized) bucket.add(normalized);
      });
      return Array.from(bucket).sort((a, b) => a.localeCompare(b));
    }

    function renderMembers() {
      const membersPicker = document.getElementById("membersPicker");
      const combined = dedupeMemberList([...users, ...manualMembers, user]);
      membersPicker.innerHTML = combined.map((name) => {
        const checked = name === user ? "checked" : "";
        return `<label class="member-option"><input class="member-check" type="checkbox" value="${escapeHtml(name)}" ${checked}>${escapeHtml(name)}</label>`;
      }).join("");

      const emptyState = document.getElementById("membersEmpty");
      emptyState.style.display = combined.length ? "none" : "block";
    }

    function addMemberFromInput() {
      const input = document.getElementById("memberInput");
      const feedback = document.getElementById("formFeedback");
      const value = normalizeUsername(input.value);

      if (!value) {
        feedback.textContent = "Enter a username before adding a member.";
        return;
      }

      const current = dedupeMemberList([...users, ...manualMembers, user]);
      if (current.includes(value)) {
        feedback.textContent = `${value} is already in the member list.`;
        input.value = "";
        return;
      }

      manualMembers.push(value);
      renderMembers();

      const checkboxes = Array.from(document.querySelectorAll(".member-check"));
      const target = checkboxes.find((el) => el.value === value);
      if (target) target.checked = true;

      feedback.textContent = `Added ${value} to project members.`;
      input.value = "";
    }

    async function loadUsers() {
      try {
        const response = await fetchWithTimeout(`${PROJECTS_API}/users`);
        if (!response.ok) throw new Error("Failed");
        const data = await response.json();
        const incoming = Array.isArray(data?.users) ? data.users : [];
        users = dedupeMemberList(incoming.map((item) => {
          if (typeof item === "string") return item;
          return item?.username || "";
        }));
      } catch (_err) {
        users = [];
      }

      if (!users.includes(user)) {
        users.push(user);
      }

      renderMembers();
    }

    async function handleCreateProject(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const feedback = document.getElementById("formFeedback");
      const createBtn = document.getElementById("createProjectBtn");

      const members = selectedMembers();
      const payload = {
        username: user,
        title: document.getElementById("projectTitle").value.trim(),
        summary: document.getElementById("projectSummary").value.trim() || "No summary provided.",
        status: document.getElementById("projectStatus").value.trim() || "Planning",
        deadline: document.getElementById("projectDeadline").value || "",
        progress: Number(document.getElementById("projectProgress").value || 0),
        visibility: document.getElementById("projectVisibility").value || "private",
        lifecycleStage: document.getElementById("projectLifecycle").value || "Planning",
        members,
        team: `Team: ${members.length} ${members.length === 1 ? "person" : "people"}`,
        priority: document.getElementById("projectPriority").value || "Priority: Medium",
        risk: document.getElementById("projectRisk").value.trim() || "Risk: None",
        course: document.getElementById("projectCourse").value || "General Studies",
        gitRepoUrl: document.getElementById("projectGitRepo").value.trim(),
        gitBranch: document.getElementById("projectGitBranch").value.trim() || "main",
        gitNotes: document.getElementById("projectGitNotes").value.trim(),
        timeline: []
      };

      if (!payload.title) {
        feedback.textContent = "Project name is required.";
        alert("Project name is required.");
        return;
      }

      try {
        createBtn.disabled = true;
        createBtn.textContent = "Creating...";
        feedback.textContent = "Creating project...";
        const response = await fetchWithTimeout(`${PROJECTS_API}/projects`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let message = "Failed to create project";
          try {
            const errorData = await response.json();
            if (errorData?.error) message = errorData.error;
          } catch (_ignore) {}
          throw new Error(message);
        }
        const data = await response.json();
        let projectId = data?.project?.id;

        if (!projectId) {
          try {
            const listRes = await fetch(`${PROJECTS_API}/projects?username=${encodeURIComponent(user)}`);
            if (listRes.ok) {
              const listData = await listRes.json();
              const projects = Array.isArray(listData.projects) ? listData.projects : [];
              const found = projects.find((project) => String(project.title || "") === payload.title);
              if (found?.id) projectId = found.id;
            }
          } catch (_ignore) {}
        }

        if (projectId) {
          localStorage.setItem("rolebit_last_created_project_id", String(projectId));
          if (data?.project) {
            localStorage.setItem("rolebit_last_created_project_payload", JSON.stringify(data.project));
          }
        }

        feedback.textContent = `Project created for ${user}. Opening project detail page...`;
        setTimeout(() => {
          if (projectId) {
            window.location.href = `project-detail.html?projectId=${encodeURIComponent(projectId)}`;
          } else {
            window.location.href = "my-projects.html";
          }
        }, 450);
      } catch (err) {
        if (err?.name === "AbortError") {
          feedback.textContent = "Backend not reachable. Start server: npm --prefix backend start";
          alert(feedback.textContent);
          return;
        }
        feedback.textContent = `Could not create project: ${err?.message || "Try again."}`;
        alert(feedback.textContent);
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = "Create Project";
      }
    }

    document.getElementById("projectForm").addEventListener("submit", handleCreateProject);
    document.getElementById("createProjectBtn").addEventListener("click", handleCreateProject);
    document.getElementById("addMemberBtn").addEventListener("click", addMemberFromInput);
    document.getElementById("memberInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addMemberFromInput();
      }
    });

    loadUsers();
  </script>
</body>
</html>
